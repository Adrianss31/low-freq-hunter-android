name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v1.1.0
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard checks
        run: |
          node --test tests/*.test.cjs
          for file in app/src/main/assets/dashboard*.js; do node --check "$file"; done

      - name: Android tests and lint
        run: ./gradlew testReleaseUnitTest lintRelease

      - name: Richiedi firma per le release
        if: github.ref_type == 'tag'
        run: test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"

      - name: Decodifica keystore
        if: env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_VERSION }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/keystore.p12"
            export KEY_ALIAS=lowfreqhunter
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          ./gradlew assembleRelease

      - name: Prepara APK
        run: cp app/build/outputs/apk/release/app-release*.apk lowfreqhunter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lowfreqhunter-apk
          path: lowfreqhunter.apk

      - name: Pubblica release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: lowfreqhunter.apk
