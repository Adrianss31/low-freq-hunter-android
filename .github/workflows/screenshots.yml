name: UI screenshots

# Fotografie della UI con dati sintetici (Robolectric): per controllare il
# design senza un dispositivo. Gira sui branch di lavoro, non su main.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Classi di test (pattern --tests)"
        default: "*UiShot*"
  push:
    branches-ignore: [main]
    paths:
      - "app/src/main/java/**/ui/**"
      - "app/src/test/java/**/UiScreenshotTest.kt"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Screenshot
        timeout-minutes: 30
        env:
          LFH_SCREENSHOTS: "1"
        run: ./gradlew testReleaseUnitTest --tests "${{ inputs.filter || '*UiShot*' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            app/build/reports/screenshots/
            app/build/reports/tests/
